# Node.js CI workflow

name: Node.js CI

on: [push, pull_request]

# runs that may deploy (main, version tags) share a group so that they
# push to gh-pages one after the other, other runs are grouped per ref
concurrency:
  group: >-
    ${{ github.workflow }}-${{
    (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    && 'gh-pages' || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v7
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '26'
    - name: Enable corepack
      run: npm install -g corepack && corepack enable
    - name: Install dependencies
      run: yarn install --immutable
    - name: Run lint
      run: yarn run lint
    - name: Run tests
      run: yarn run test-ci
    - name: Build
      run: yarn run build-demo
    - name: Get deploy target
      id: target
      # main branch: trunk, release tag (v1.2.3): stable,
      # anything else (other branches, pre-release tags, PRs): no deploy
      run: |
        if [[ "$GITHUB_REF" == refs/heads/main ]]; then
          echo "dir=./demo/trunk" >> "$GITHUB_OUTPUT"
        elif [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "dir=./demo/stable" >> "$GITHUB_OUTPUT"
        fi
    - name: Push to gh-pages
      if: steps.target.outputs.dir != ''
      env:
        DEPLOY_DIR: ${{ steps.target.outputs.dir }}
      run: |
        git config user.email github-actions@github.com
        git config user.name github-actions
        # shallow checkout: only fetch the gh-pages tip
        git fetch --depth=1 origin gh-pages:gh-pages
        git checkout gh-pages
        mkdir -p "$DEPLOY_DIR"
        # ':?' aborts if DEPLOY_DIR is empty or unset (avoids 'rm -Rf /*')
        rm -Rf "${DEPLOY_DIR:?}"/*
        cp -Rf ./build/demo/* "$DEPLOY_DIR"
        git add -A "$DEPLOY_DIR"
        git diff-index --quiet HEAD ||
          git commit -m "CI run ${{ github.run_number }} pushed to $DEPLOY_DIR"
        git push origin gh-pages
