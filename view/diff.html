<!DOCTYPE html>
<html>

<head>
<title>DICOM Parser Diff</title>
<meta charset="UTF-8">
<link type="text/css" rel="stylesheet" href="../css/style.css" />

<!-- ctk-dcmjs: emscripten build, only works as globals -->
<script src="../ext/ctk-dcmjs/libs/jquery-1.11.0.min.js"></script>
<script src="../ext/ctk-dcmjs/libs/dcmjs-nico.js"></script>
<script src="../ext/ctk-dcmjs/utils.js"></script>

</head>

<body>

  <h2>DICOM dump diff</h2>

  <p>Show differences between DICOM dump from ctk-dcmjs and dwv.</p>

  <div id="browser"></div>

  <div id="input">
    <fieldset>
      <legend>Input</legend>
      <ul>
        <li>Use default data, number:
          <input type="number" name="quantity" id="data-quantity" min="1">
        </li>
        <li>
          <input type="file" multiple="true" id="file-input">
        </li>
        <li>
          <div id="dropbox">Drop files here</div>
        </li>
    </fieldset>
  </div>

  <div id="toolbar">
    <button id="launch-button">Launch</button>
    <p id="status">Ready</p>
  </div>

  <div id="results"></div>

</body>

</html>
