<!DOCTYPE html>
<html>

<head>
<title>DICOM Parser Memcheck</title>
<meta charset="UTF-8">
<link type="text/css" rel="stylesheet" href="../css/style.css" />

<!-- dwv-previous: vendored UMD build, only works as a global -->
<script src="../ext/dwv-previous/dwv.min.js"></script>

</head>

<body>

  <h2>Memory check</h2>

  <p>Show memory consumption. Only for Google Chrome launched with the <code>--enable-precise-memory-info</code> flag.</p>

  <div id="browser"></div>

  <div id="input">
    <fieldset>
      <legend>Input</legend>
      <ul>
        <li>Use default data, number:
          <input type="number" name="quantity" id="data-quantity" min="1">
        </li>
        <li>
          <input type="file" multiple="true" id="file-input">
        </li>
        <li>
          <div id="dropbox">Drop files here</div>
        </li>
    </fieldset>
  </div>

  <div id="toolbar">
    <button id="launch-button">Launch</button>
    <p id="status">Ready</p>
  </div>

  <div id="results"></div>

</body>

</html>
