<!DOCTYPE html>
<html>

<head>
<title>DICOM Parser Diff</title>
<meta charset="UTF-8">
<link type="text/css" rel="stylesheet" href="../css/style.css" />

<!-- parsers, each in its own iframe -->
<iframe src="./parsers/ctk-dcmjs.html" id="iframe-ctk-dcmjs" style="display:none"></iframe>
<iframe src="./parsers/dwv.html" id="iframe-dwv" style="display:none"></iframe>

</head>

<body>

  <h2>DICOM dump diff</h2>

  <p>Show differences between DICOM dump from ctk-dcmjs and dwv.</p>

  <div id="browser"></div>

  <div id="input">
    <fieldset>
      <legend>Input</legend>
      <ul>
        <li>Use default data, number:
          <input type="number" name="quantity" id="data-quantity" min="1">
        </li>
        <li>
          <input type="file" multiple="true" id="file-input">
        </li>
        <li>
          <div id="dropbox">Drop files here</div>
        </li>
    </fieldset>
  </div>

  <div id="toolbar">
    <button id="launch-button">Launch</button>
    <p id="status">Ready</p>
  </div>

  <div id="results"></div>

</body>

</html>
