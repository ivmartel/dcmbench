<!DOCTYPE html>
<html>

<head>
<title>iframe-<%= htmlWebpackPlugin.options.parserName %></title>
<meta charset="UTF-8">
<% for (const src of htmlWebpackPlugin.options.globalScripts) { %>
<script src="<%= src %>"></script>
<% } %>
</head>

<!--
  Parser page template, generated by webpack.dev.js for each parser.
  The parser module exports (parse, parse2, dump) are set on this
  window by the bundle so that the views can get them through
  iframe.contentWindow.
-->

</html>
